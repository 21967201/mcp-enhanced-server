name: Deploy MCP Enhanced Server to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-mcp-cf.yml'
  workflow_dispatch:

concurrency:
  group: deploy-mcp-cf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::缺少 secrets.CLOUDFLARE_API_TOKEN"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::缺少 secrets.CLOUDFLARE_ACCOUNT_ID"; exit 1; fi

      - name: Create D1 database if not exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME="mcp-enhanced-tasks"
          echo "Checking if D1 database '${DB_NAME}' exists..."

          RESPONSE=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          DB_ID=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for db in data.get('result', []):
              if db['name'] == '${DB_NAME}':
                  print(db['uuid'])
                  break
          " 2>/dev/null || true)

          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database '${DB_NAME}'..."
            CREATE_RESPONSE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${DB_NAME}\"}")

            DB_ID=$(echo "$CREATE_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if data.get('success'):
              print(data['result']['uuid'])
          else:
              print('ERROR: ' + str(data.get('errors')), file=sys.stderr)
              sys.exit(1)
          " 2>/dev/null)

            if [ -z "$DB_ID" ]; then
              echo "Failed to create D1 database"
              echo "$CREATE_RESPONSE"
              exit 1
            fi
            echo "Created D1 database with ID: ${DB_ID}"
          else
            echo "D1 database already exists with ID: ${DB_ID}"
          fi

          echo "DB_ID=${DB_ID}" >> $GITHUB_ENV
          echo "DATABASE_ID=${DB_ID}" >> $GITHUB_ENV

      - name: Update wrangler.toml with database ID
        if: env.DB_ID != ''
        run: |
          if grep -q 'REPLACE_WITH_YOUR_D1_DATABASE_ID' wrangler.toml; then
            sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/g" wrangler.toml
          else
            sed -i -E "s|^database_id = \".*\"|database_id = \"${DB_ID}\"|" wrangler.toml
          fi
          grep -n 'database_id' wrangler.toml
          echo "wrangler.toml database_id set to: ${DB_ID}"

      - name: Initialize D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute mcp-enhanced-tasks \
            --remote \
            --file=src/schema.sql

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.MCP_AUTH_TOKEN }}" ]; then
            echo "${{ secrets.MCP_AUTH_TOKEN }}" | npx wrangler secret put MCP_AUTH_TOKEN
          fi

      - name: Output deployment info
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **D1 Database ID**: \`${{ env.DB_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker URL**: https://mcp-enhanced-server.\${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP Endpoint**: https://mcp-enhanced-server.\${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/mcp" >> $GITHUB_STEP_SUMMARY