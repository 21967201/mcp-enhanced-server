name = "mcp-enhanced-server"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
ENVIRONMENT = "production"
MCP_ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "mcp-enhanced-tasks"
database_id = "3879f916-72d3-4dbf-9cf1-650825e5380d"

[env.dev]
name = "mcp-enhanced-server-dev"
[env.dev.vars]
ENVIRONMENT = "development"
MCP_ALLOWED_ORIGINS = "localhost"
